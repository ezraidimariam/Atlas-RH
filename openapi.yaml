openapi: 3.0.3
info:
  title: AtlasRH API
  version: 1.0.0
  description: Core human resources management API.
servers:
  - url: http://localhost:8080
security:
  - basicAuth: []
paths:
  /api/departments:
    get:
      tags: [Departments]
      summary: List departments
      responses:
        '200':
          description: Department list
    post:
      tags: [Departments]
      summary: Create a department
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentInput' }
      responses:
        '201': { description: Department created }
        '400': { description: Invalid input }
        '409': { description: Department name already exists }
  /api/departments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [Departments]
      summary: Get a department
      responses:
        '200': { description: Department details }
        '404': { description: Department not found }
    put:
      tags: [Departments]
      summary: Replace a department
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartmentInput' }
      responses:
        '200': { description: Department updated }
        '400': { description: Invalid input }
        '404': { description: Department not found }
        '409': { description: Duplicate name or department has employees }
    delete:
      tags: [Departments]
      summary: Delete an unused department
      responses:
        '204': { description: Department deleted }
        '404': { description: Department not found }
        '409': { description: Department has employees }
  /api/employees:
    get:
      tags: [Employees]
      summary: List employees
      responses:
        '200': { description: Employee list }
    post:
      tags: [Employees]
      summary: Create an employee
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeInput' }
      responses:
        '201': { description: Employee created }
        '400': { description: Invalid input }
        '404': { description: Department or manager not found }
        '409': { description: Employee number or email already exists }
  /api/employees/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [Employees]
      summary: Get an employee
      responses:
        '200': { description: Employee details }
        '404': { description: Employee not found }
    put:
      tags: [Employees]
      summary: Replace an employee
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeInput' }
      responses:
        '200': { description: Employee updated }
        '400': { description: Invalid input or reporting cycle }
        '404': { description: Employee, department, or manager not found }
        '409': { description: Duplicate employee number or email }
    delete:
      tags: [Employees]
      summary: Delete an employee without linked records
      responses:
        '204': { description: Employee deleted }
        '404': { description: Employee not found }
        '409': { description: Employee has linked records }
  /api/contracts:
    get:
      tags: [Contracts]
      summary: List contracts
      parameters:
        - { name: employeeId, in: query, required: false, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Contract list }
    post:
      tags: [Contracts]
      summary: Create a contract
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractInput' }
      responses:
        '201': { description: Contract created }
        '400': { description: Invalid input or date range }
        '404': { description: Employee not found }
  /api/contracts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [Contracts]
      summary: Get a contract
      responses:
        '200': { description: Contract details }
        '404': { description: Contract not found }
    put:
      tags: [Contracts]
      summary: Replace a contract
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractInput' }
      responses:
        '200': { description: Contract updated }
        '400': { description: Invalid input or date range }
        '404': { description: Contract or employee not found }
    delete:
      tags: [Contracts]
      summary: Delete a contract
      responses:
        '204': { description: Contract deleted }
        '404': { description: Contract not found }
  /api/leave-requests:
    get:
      tags: [Leave requests]
      summary: List leave requests
      parameters:
        - { name: employeeId, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [PENDING, APPROVED, REJECTED] } }
      responses:
        '200': { description: Leave request list }
    post:
      tags: [Leave requests]
      summary: Submit a leave request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveRequestInput' }
      responses:
        '201': { description: Leave request submitted }
        '400': { description: Invalid dates or input }
        '404': { description: Employee not found }
        '409': { description: Overlaps an approved leave }
  /api/leave-requests/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [Leave requests]
      summary: Get a leave request
      responses:
        '200': { description: Leave request details }
        '404': { description: Leave request not found }
    delete:
      tags: [Leave requests]
      summary: Delete a pending leave request
      responses:
        '204': { description: Leave request deleted }
        '404': { description: Leave request not found }
        '409': { description: Leave request is no longer pending }
  /api/leave-requests/{id}/approve:
    post:
      tags: [Leave requests]
      summary: Approve a pending leave request
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Leave approved }
        '404': { description: Leave request not found }
        '409': { description: Request is not pending or overlaps another approved leave }
  /api/leave-requests/{id}/reject:
    post:
      tags: [Leave requests]
      summary: Reject a pending leave request
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Leave rejected }
        '404': { description: Leave request not found }
        '409': { description: Request is not pending }
  /api/employees/search:
    get:
      tags: [Employees]
      summary: Search and page through employees
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: departmentId, in: query, schema: { type: integer, format: int64 } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Paged employee results }
        '400': { description: Invalid page parameters }
  /api/employees/{id}/status:
    put:
      tags: [Employees]
      summary: Activate or deactivate an employee
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: active, in: query, required: true, schema: { type: boolean } }
      responses:
        '200': { description: Employee status updated }
        '404': { description: Employee not found }
  /api/attendance:
    get:
      tags: [Attendance]
      summary: List attendance records in a date range
      parameters:
        - { name: employeeId, in: query, schema: { type: integer, format: int64 } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Attendance records }
        '400': { description: Invalid date range }
  /api/attendance/summary:
    get:
      tags: [Attendance]
      summary: Summarize attendance in a date range
      parameters:
        - { name: employeeId, in: query, schema: { type: integer, format: int64 } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Recorded days, incomplete days, and worked minutes }
  /api/attendance/{employeeId}/clock-in:
    post:
      tags: [Attendance]
      summary: Record employee arrival
      parameters:
        - { name: employeeId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '201': { description: Clock-in recorded }
        '404': { description: Employee not found }
        '409': { description: Inactive employee or duplicate clock-in }
  /api/attendance/{employeeId}/clock-out:
    post:
      tags: [Attendance]
      summary: Record employee departure
      parameters:
        - { name: employeeId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Clock-out recorded }
        '404': { description: Today's clock-in not found }
        '409': { description: Already clocked out }
  /api/job-openings:
    get:
      tags: [Recruitment]
      summary: List job openings
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [OPEN, CLOSED] } }
      responses:
        '200': { description: Job openings }
    post:
      tags: [Recruitment]
      summary: Create a job opening
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobOpeningInput' }
      responses:
        '201': { description: Job opening created }
  /api/job-openings/{id}:
    get:
      tags: [Recruitment]
      summary: Get a job opening
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Job opening }
        '404': { description: Job opening not found }
  /api/job-openings/{id}/status:
    put:
      tags: [Recruitment]
      summary: Open or close a job opening
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: status, in: query, required: true, schema: { type: string, enum: [OPEN, CLOSED] } }
      responses:
        '200': { description: Opening status updated }
  /api/job-openings/{openingId}/applications:
    get:
      tags: [Recruitment]
      summary: List applications for an opening
      parameters:
        - { name: openingId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Applications }
    post:
      tags: [Recruitment]
      summary: Apply to an open position
      parameters:
        - { name: openingId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobApplicationInput' }
      responses:
        '201': { description: Application received }
        '409': { description: Opening is closed }
  /api/job-applications/{id}/status:
    put:
      tags: [Recruitment]
      summary: Update a candidate application status
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: status, in: query, required: true, schema: { type: string, enum: [RECEIVED, REVIEWING, ACCEPTED, REJECTED] } }
      responses:
        '200': { description: Application status updated }
        '404': { description: Application not found }
  /api/training-courses:
    get:
      tags: [Training]
      summary: List training courses
      responses:
        '200': { description: Training courses }
    post:
      tags: [Training]
      summary: Create a training course
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrainingCourseInput' }
      responses:
        '201': { description: Training course created }
  /api/training-courses/{id}:
    get:
      tags: [Training]
      summary: Get a training course
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Training course }
        '404': { description: Training course not found }
    put:
      tags: [Training]
      summary: Update a training course
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrainingCourseInput' }
      responses:
        '200': { description: Training course updated }
        '404': { description: Training course not found }
    delete:
      tags: [Training]
      summary: Delete a training course
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Training course deleted }
        '404': { description: Training course not found }
  /api/training-enrollments:
    post:
      tags: [Training]
      summary: Enroll an employee in a course
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrainingEnrollmentInput' }
      responses:
        '201': { description: Employee enrolled }
        '404': { description: Employee or course not found }
        '409': { description: Employee inactive or already enrolled }
  /api/training-enrollments/{id}/complete:
    post:
      tags: [Training]
      summary: Mark training as completed
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Enrollment completed }
  /api/training-enrollments/{id}/cancel:
    post:
      tags: [Training]
      summary: Cancel active training enrollment
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Enrollment cancelled }
  /api/training-enrollments/employee/{employeeId}:
    get:
      tags: [Training]
      summary: List an employee's training enrollments
      parameters:
        - { name: employeeId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Training enrollments }
  /api/payslips:
    get:
      tags: [Payroll]
      summary: List payslips, optionally filtered by employee
      parameters:
        - { name: employeeId, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Payslips }
    post:
      tags: [Payroll]
      summary: Create a payslip for a month
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayslipInput' }
      responses:
        '201': { description: Payslip created }
        '400': { description: Invalid period or negative net salary }
        '404': { description: Employee not found }
        '409': { description: Payslip exists for that employee and period }
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    DepartmentInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 500, nullable: true }
    EmployeeInput:
      type: object
      required: [employeeNumber, lastName, firstName, email, jobTitle, hireDate, departmentId]
      properties:
        employeeNumber: { type: string, maxLength: 30 }
        lastName: { type: string, maxLength: 100 }
        firstName: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 150 }
        jobTitle: { type: string, maxLength: 100 }
        hireDate: { type: string, format: date }
        departmentId: { type: integer, format: int64 }
        managerId: { type: integer, format: int64, nullable: true }
    JobOpeningInput:
      type: object
      required: [title, description, departmentId, openedOn]
      properties:
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 4000 }
        departmentId: { type: integer, format: int64 }
        openedOn: { type: string, format: date }
        closesOn: { type: string, format: date, nullable: true }
    JobApplicationInput:
      type: object
      required: [fullName, email]
      properties:
        fullName: { type: string, maxLength: 120 }
        email: { type: string, format: email, maxLength: 150 }
        phone: { type: string, maxLength: 30, nullable: true }
        resumeUrl: { type: string, maxLength: 1000, nullable: true }
    TrainingCourseInput:
      type: object
      required: [title, durationHours]
      properties:
        title: { type: string, maxLength: 150 }
        description: { type: string, maxLength: 4000, nullable: true }
        provider: { type: string, maxLength: 150, nullable: true }
        durationHours: { type: number, minimum: 0, exclusiveMinimum: true }
    TrainingEnrollmentInput:
      type: object
      required: [employeeId, courseId]
      properties:
        employeeId: { type: integer, format: int64 }
        courseId: { type: integer, format: int64 }
    PayslipInput:
      type: object
      required: [employeeId, periodYear, periodMonth, grossSalary, additions, deductions]
      properties:
        employeeId: { type: integer, format: int64 }
        periodYear: { type: integer, minimum: 2000, maximum: 2100 }
        periodMonth: { type: integer, minimum: 1, maximum: 12 }
        grossSalary: { type: number, minimum: 0 }
        additions: { type: number, minimum: 0 }
        deductions: { type: number, minimum: 0 }
    ContractInput:
      type: object
      required: [type, startDate, grossSalary, employeeId]
      properties:
        type: { type: string, enum: [CDI, CDD, STAGE] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true }
        grossSalary: { type: number, minimum: 0 }
        employeeId: { type: integer, format: int64 }
    LeaveRequestInput:
      type: object
      required: [employeeId, startDate, endDate, reason]
      properties:
        employeeId: { type: integer, format: int64 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        reason: { type: string, maxLength: 500 }

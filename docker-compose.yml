services:
  db:
    image: postgres:17-alpine
    container_name: atlasrh-db
    environment:
      POSTGRES_DB: atlasrh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - atlasrh-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atlasrh"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: atlasrh-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/atlasrh
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"

volumes:
  atlasrh-postgres-data:
